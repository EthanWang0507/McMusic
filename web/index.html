<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McMusic - MIDI 红石音乐生成器</title>
<link rel="stylesheet" href="/css/index.css">
</head>
<body>

<div class="app">
  <!-- 顶部栏 -->
  <div class="topbar">
    <div class="topbar-left">
      <span class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
      <span class="logo">McMusic</span>
      <span class="subtitle">MIDI → Minecraft 红石音乐</span>
    </div>
    <button class="settings-btn" onclick="openDrawer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> 默认设置
    </button>
  </div>

  <!-- 步骤指示器 -->
  <div class="stepper" id="stepper"></div>

  <!-- 内容区 -->
  <div id="content"></div>

  <!-- 底部导航 -->
  <div class="nav-bar">
    <button class="btn btn-secondary" id="prevBtn" onclick="prevStep()" style="visibility:hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> 上一步</button>
    <button class="btn btn-primary" id="nextBtn" onclick="nextStep()">下一步 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
  </div>
</div>

<!-- 设置抽屉 -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="drawer-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> 默认设置</span>
    <button class="drawer-close" onclick="closeDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer">
    <button class="btn btn-secondary" style="flex:1" onclick="resetDefaults()">重置</button>
    <button class="btn btn-primary" style="flex:1" onclick="saveDefaults()">保存</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===================== 状态管理 =====================
const STEPS = ['选择文件', '解析预览', '模式配置', '检查确认', '放置完成'];
const DEFAULT_CONFIG = {
  tps: 20.0, track_gap: 3, sx: 0, sy: 0, sz: 0,
  place_mode: 'rcon', auto_confirm: false,
  rcon_host: '127.0.0.1', rcon_port: 25575, rcon_pwd: '',
  mcfunction_output: 'output.mcfunction'
};

let state = {
  step: 0,
  config: { ...DEFAULT_CONFIG },
  file: null,
  parseResultMap: new Map(),
  parseHash: null,
  midiIsParsed: false,
  placeMode: 'rcon',
  checks: [],
  progress: 0,
  logs: []
};

// 加载 localStorage
function loadConfig() {
  try {
    const saved = localStorage.getItem('mcmusic_defaults');
    if (saved) state.config = { ...DEFAULT_CONFIG, ...JSON.parse(saved) };
  } catch(e) {}
  // 同步当前会话的放置模式
  state.placeMode = state.config.place_mode || 'rcon';
}
loadConfig();

// ===================== SVG 图标库 =====================
const ICONS = {
  music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
  fileMusic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><circle cx="11" cy="16" r="1.5"/><path d="M12.5 13.5v-3l3-1"/></svg>',
  cube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
  monitor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',
  fileText: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>',
  lightbulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>',
  clipboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>',
  checkCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  alertCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  arrowRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
  arrowLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>',
  refreshCw: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
};
function icon(name) { return ICONS[name] || ''; }

// ===================== 步骤指示器 =====================
function renderStepper() {
  const el = document.getElementById('stepper');
  el.innerHTML = STEPS.map((label, i) => {
    let circleContent = i + 1;
    if (i < state.step) {
      circleContent = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
    }
    return `
      <div class="step ${i < state.step ? 'completed' : ''} ${i === state.step ? 'active' : ''}">
        <div class="step-circle">${circleContent}</div>
        <div class="step-label">${label}</div>
        ${i < STEPS.length - 1 ? '<div class="step-connector"><div class="step-connector-fill"></div></div>' : ''}
      </div>
    `;
  }).join('');
}

// ===================== 页面渲染 =====================
let _animTimer = null;

function renderPage(direction) {
  const content = document.getElementById('content');

  // 立即清理所有正在退出的残留卡片，防止堆叠
  content.querySelectorAll('.content-card.page-exit, .content-card.page-exit-forward, .content-card.page-exit-backward').forEach(c => c.remove());
  if (_animTimer) { clearTimeout(_animTimer); _animTimer = null; }

  // 找到当前活动卡片（排除正在退出的）
  const oldCard = content.querySelector('.content-card:not(.page-exit):not(.page-exit-forward):not(.page-exit-backward)');

  const card = document.createElement('div');
  card.className = 'content-card';

  switch(state.step) {
    case 0: card.innerHTML = renderStep1(); break;
    case 1: card.innerHTML = renderStep2(); break;
    case 2: card.innerHTML = renderStep3(); break;
    case 3: card.innerHTML = renderStep4(); break;
    case 4: card.innerHTML = renderStep5(); break;
  }

  // 根据方向选择动画类
  const exitClass = direction === 'forward' ? 'page-exit-forward'
                   : direction === 'backward' ? 'page-exit-backward'
                   : 'page-exit';
  const enterClass = direction === 'forward' ? 'page-enter-forward'
                   : direction === 'backward' ? 'page-enter-backward'
                   : 'page-enter';
  const animDuration = direction ? 500 : 350;

  if (oldCard) {
    // 固定容器高度为旧卡片高度，然后平滑过渡到新卡片高度
    const oldHeight = oldCard.offsetHeight;
    content.style.height = oldHeight + 'px';
    content.style.transition = 'none';

    content.appendChild(card);
    const newHeight = card.offsetHeight;

    // 强制重排后启动高度过渡
    content.offsetHeight;
    content.style.transition = 'height ' + (animDuration / 1000) + 's cubic-bezier(0.4, 0, 0.2, 1)';
    content.style.height = newHeight + 'px';

    // 清除旧卡片可能残留的进入动画类，防止与退出动画冲突
    oldCard.classList.remove('page-enter', 'page-enter-forward', 'page-enter-backward');
    oldCard.classList.add(exitClass);
    card.classList.add(enterClass);

    _animTimer = setTimeout(() => {
      oldCard.remove();
      card.classList.remove(enterClass);
      content.style.transition = '';
      content.style.height = '';
      _animTimer = null;
    }, animDuration);
  } else {
    content.appendChild(card);
  }

  // 页面特定的初始化
  if (state.step === 0) initStep1();
  if (state.step === 1) initStep2();
  if (state.step === 4) initStep5();

  updateNavButtons();
}

function updateNavButtons() {
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  prev.style.visibility = state.step === 0 ? 'hidden' : 'visible';

  if (state.step === STEPS.length - 1) {
    next.innerHTML = '完成';
    next.disabled = false;
  } else if (state.step === 3) {
    next.innerHTML = '开始放置 ' + icon('arrowRight');
    next.disabled = !state.checks.every(c => c.status !== 'pending');
  } else if (state.step === 0) {
    next.innerHTML = '下一步 ' + icon('arrowRight');
    next.disabled = !state.file;
  } else if (state.step === 1){
    next.innerHTML = '下一步 ' + icon('arrowRight');
    next.disabled = !state.midiIsParsed;
  } else {
    next.innerHTML = '下一步 ' + icon('arrowRight');
    next.disabled = false;
  }
}

// ===================== 步骤1：文件选择 =====================
function renderStep1() {
  const c = state.config;
  return `
    <div class="page-title">选择 MIDI 文件与基础参数</div>
    <div class="page-desc">选择要转换的 MIDI 文件，并设置放置的基础参数</div>

    <div id="uploadArea">
      ${state.file ? `
        <div class="file-info">
          <span class="file-icon">${icon("fileMusic")}</span>
          <span class="file-name">${state.file.name}</span>
          <span class="file-size">${formatSize(state.file.size)}</span>
          <button class="file-remove" onclick="removeFile()">${icon("x")}</button>
        </div>
      ` : `
        <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
          <div class="upload-icon">${icon("upload")}</div>
          <div class="upload-text">点击或拖拽 MIDI 文件到此处</div>
          <div class="upload-hint">支持 .mid / .midi 格式</div>
        </div>
        <input type="file" id="fileInput" accept=".mid,.midi" style="display:none">
      `}
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">TPS（每秒刻数）</label>
        <input class="form-input" type="number" step="0.1" value="${c.tps}" id="inputTps">
      </div>
      <div class="form-group">
        <label class="form-label">轨道间隔</label>
        <input class="form-input" type="number" value="${c.track_gap}" id="inputTrackGap">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">起始坐标</label>
      <div class="coord-row">
        <div class="coord-item">
          <label class="form-label"><span class="coord-axis">X</span></label>
          <input class="form-input" type="number" value="${c.sx}" id="inputSx">
        </div>
        <div class="coord-item">
          <label class="form-label"><span class="coord-axis">Y</span></label>
          <input class="form-input" type="number" value="${c.sy}" id="inputSy">
        </div>
        <div class="coord-item">
          <label class="form-label"><span class="coord-axis">Z</span></label>
          <input class="form-input" type="number" value="${c.sz}" id="inputSz">
        </div>
      </div>
    </div>
  `;
}

function initStep1() {
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  if (fileInput) {
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });
  }
  if (dropZone) {
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
  }
}

function handleFile(file) {
  if (!file.name.match(/\.(mid|midi)$/i)) {
    showToast('请选择 .mid 或 .midi 文件', 'error');
    return;
  }
  state.file = file;
  updateUploadArea();
  updateNavButtons();
}

function removeFile() {
  state.file = null;
  updateUploadArea();
  updateNavButtons();
}

function updateUploadArea() {
  const area = document.getElementById('uploadArea');
  if (!area) return;
  if (state.file) {
    area.innerHTML = `
      <div class="file-info">
        <span class="file-icon">${icon("fileMusic")}</span>
        <span class="file-name">${state.file.name}</span>
        <span class="file-size">${formatSize(state.file.size)}</span>
        <button class="file-remove" onclick="removeFile()">${icon("x")}</button>
      </div>
    `;
  } else {
    area.innerHTML = `
      <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">${icon("upload")}</div>
        <div class="upload-text">点击或拖拽 MIDI 文件到此处</div>
        <div class="upload-hint">支持 .mid / .midi 格式</div>
      </div>
      <input type="file" id="fileInput" accept=".mid,.midi" style="display:none">
    `;
    initStep1();
  }
}

// ===================== 步骤2：解析预览 =====================
function renderStep2() {
  if (!state.midiIsParsed) {
    return `
      <div class="page-title">解析预览</div>
      <div class="page-desc">正在解析 MIDI 文件，请稍候...</div>
      <div class="loading-state">
        <div class="spinner"></div>
        <div class="loading-text">正在解析 MIDI 文件...</div>
      </div>
    `;
  }
  const r = state.parseResultMap.get(state.parseHash);
  return `
    <div class="page-title">解析预览</div>
    <div class="page-desc">查看 MIDI 解析结果和方块统计</div>

    <div class="info-cards">
      <div class="info-card">
        <div class="info-card-title midi">${icon("music")} MIDI 信息</div>
        <div class="info-row"><span class="info-row-label">音乐时长</span><span class="info-row-value">${r.duration} 秒</span></div>
        <div class="info-row"><span class="info-row-label">轨道数</span><span class="info-row-value">${r.tracks}</span></div>
        <div class="info-row"><span class="info-row-label">PPQN</span><span class="info-row-value">${r.ppqn}</span></div>
      </div>
      <div class="info-card">
        <div class="info-card-title block">${icon("cube")} 方块统计</div>
        <div class="info-row"><span class="info-row-label">方块数量</span><span class="info-row-value">${r.block_count}</span></div>
        <div class="info-row"><span class="info-row-label">起始坐标</span><span class="info-row-value">(${r.start_x}, ${r.start_y}, ${r.start_z})</span></div>
        <div class="info-row"><span class="info-row-label">终点坐标</span><span class="info-row-value">(${r.end_x}, ${r.end_y}, ${r.end_z})</span></div>
      </div>
    </div>
  `;
}

async function initStep2() {
  if (state.midiIsParsed) return;

  // 如果尚未预计算哈希（例如直接从其他路径进入），先计算
  if (!state.parseHash) {
    await prepareParse();
  }
  if (state.midiIsParsed) return;

  doParse();
}

function doParse() {
  const c = state.config;
  const formData = new FormData();
  formData.append("file", state.file);
  formData.append("tps", c.tps);
  formData.append("sx", c.sx);
  formData.append("sy", c.sy);
  formData.append("sz", c.sz);
  formData.append("track_gap", c.track_gap);

  fetch("/api/parse", {
    method: "POST",
    body: formData
  })
    .then(response => {
      if (response.ok) {
        return response.json();
      } else {
        throw new Error("服务器返回错误 (" + response.status + ")");
      }
    })
    .then(data => {
      state.midiIsParsed = true;
      state.parseResultMap.set(state.parseHash, {
          start_x: data.start_x,
          start_y: data.start_y,
          start_z: data.start_z,
          end_x: data.end_x,
          end_y: data.end_y,
          end_z: data.end_z,
          duration: data.duration,
          tracks: data.tracks,
          ppqn: data.ppqn,
          block_count: data.block_count
      });
      // 仅当用户仍停留在步骤2时才重新渲染，避免产生重复页面
      if (state.step === 1) renderPage();
    })
    .catch(error => {
      showToast('MIDI 解析失败：' + error.message, 'error');
      // 在卡片内显示错误状态和重试按钮
      if (state.step === 1) {
        const card = document.querySelector('#content .content-card');
        if (card) {
          card.innerHTML = `
            <div class="page-title">解析预览</div>
            <div class="page-desc">解析 MIDI 文件并预览生成结果</div>
            <div class="loading-state" style="padding:30px 20px">
              <div style="color:var(--error);margin-bottom:12px;display:flex">${icon('alertCircle')}</div>
              <div class="loading-text" style="color:var(--error);margin-bottom:16px">解析失败：${error.message}</div>
              <button class="btn btn-primary" onclick="retryParse()">${icon('refreshCw')} 重试</button>
            </div>
          `;
        }
      }
    });
}

function retryParse() {
  // renderPage 会自动调用 initStep2 → doParse
  if (state.step === 1) renderPage();
}

// 构建 FormData 并计算哈希、检查缓存（在进入步骤2前调用，避免 loading 闪烁）
async function prepareParse() {
  if (!state.file) { state.midiIsParsed = false; return; }
  const c = state.config;
  const formData = new FormData();
  formData.append("file", state.file);
  formData.append("tps", c.tps);
  formData.append("sx", c.sx);
  formData.append("sy", c.sy);
  formData.append("sz", c.sz);
  formData.append("track_gap", c.track_gap);

  state.parseHash = await hashFormData(formData);

  // 无论是否命中缓存都显式设置，避免上一轮的 true 残留导致跳过新解析
  state.midiIsParsed = state.parseResultMap.has(state.parseHash);
  if (state.midiIsParsed) console.log('使用缓存Midi解析结果');
}

function selectMode(mode) {
  if (state.placeMode === mode) return;
  state.placeMode = mode;
  state.config.place_mode = mode;

  // 更新模式卡片选中状态（仅内容区内，不影响设置抽屉）
  document.querySelectorAll('#content .mode-card').forEach(card => {
    const isTarget = card.getAttribute('onclick') === `selectMode('${mode}')`;
    card.classList.toggle('selected', isTarget);
  });

  // 局部切换配置区，带淡入动画 + 高度平滑过渡
  const configEl = document.getElementById('modeConfigArea');
  const contentEl = document.getElementById('content');
  if (configEl) {
    // 取消上一次未完成的切换
    if (configEl._switchTimer) clearTimeout(configEl._switchTimer);

    const oldHeight = contentEl.offsetHeight;
    configEl.style.opacity = '0';
    configEl.style.transform = 'translateY(6px)';

    configEl._switchTimer = setTimeout(() => {
      configEl._switchTimer = null;
      configEl.innerHTML = renderModeConfig(mode);
      // 高度过渡
      const newHeight = contentEl.offsetHeight;
      if (oldHeight !== newHeight) {
        contentEl.style.transition = 'height 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        contentEl.style.height = oldHeight + 'px';
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            contentEl.style.height = newHeight + 'px';
          });
        });
        const onEnd = () => {
          contentEl.removeEventListener('transitionend', onEnd);
          contentEl.style.height = '';
          contentEl.style.transition = '';
        };
        contentEl.addEventListener('transitionend', onEnd);
      }
      configEl.style.opacity = '1';
      configEl.style.transform = 'translateY(0)';
    }, 150);
  }
}

// ===================== 步骤4：检查确认 =====================
function getCheckIcon(status) {
  if (status === 'pending') {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="9" stroke-opacity="0.2"/>
      <path d="M21 12a9 9 0 0 0-9-9"/>
    </svg>`;
  }
  if (status === 'success') {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity="0.12" stroke="none"/>
      <path class="check-tick" d="M8 12.5l3 3 5-6.5"/>
    </svg>`;
  }
  if (status === 'error') {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="9" fill="currentColor" fill-opacity="0.12" stroke="none"/>
      <path d="M9 9l6 6M15 9l-6 6"/>
    </svg>`;
  }
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14M13 6l6 6-6 6"/>
  </svg>`;
}

function renderStep4() {
  const checksHTML = state.checks.map((c, i) => `
    <div class="check-item ${c.status !== 'pending' ? 'done' : ''}" data-check-index="${i}">
      <div class="check-icon ${c.status}" id="check-icon-${i}">
        ${getCheckIcon(c.status)}
      </div>
      <span class="check-name">${c.name}</span>
      ${c.detail ? `<span class="check-detail">${c.detail}</span>` : ''}

  const r = state.parseResultMap && state.parseHash ? state.parseResultMap.get(state.parseHash) || {} : {};
  return `

    <div class="page-desc">系统将检查放置条件，请确认后开始放置</div>

    <div class="check-list">${checksHTML}</div>

    <div class="summary-card">
      <div class="summary-title">${icon("clipboard")} 放置摘要</div>
      <div class="summary-row"><span class="summary-label">文件</span><span class="summary-value">${state.file ? state.file.name : '--'}</span></div>
      <div class="summary-row"><span class="summary-label">模式</span><span class="summary-value">${state.placeMode === 'rcon' ? 'RCON 在线放置' : 'mcfunction 导出'}</span></div>
      <div class="summary-row"><span class="summary-label">音乐时长</span><span class="summary-value">${r.duration ?? '--'}</span></div>
      <div class="summary-row"><span class="summary-label">TPS</span><span class="summary-value">${state.config.tps}</span></div>
      <div class="summary-row"><span class="summary-label">方块数量</span><span class="summary-value">${r.block_count ?? '--'}</span></div>
      <div class="summary-row"><span class="summary-label">轨道数</span><span class="summary-value">${r.tracks ?? '--'}</span></div>
      <div class="summary-row"><span class="summary-label">起始坐标</span><span class="summary-value">(${r.start_x ?? '--'}, ${r.start_y ?? '--'}, ${r.start_z ?? '--'})</span></div>
      <div class="summary-row"><span class="summary-label">终止坐标</span><span class="summary-value">(${r.end_x ?? '--'}, ${r.end_y ?? '--'}, ${r.end_z ?? '--'})</span></div>
    </div>

    <div class="switch-row">
      <span class="switch-label">自动确认（跳过此步骤直接放置）</span>
      <div class="switch ${state.config.auto_confirm ? 'on' : ''}" data-switch-key="auto_confirm" onclick="toggleSwitch('auto_confirm')">
        <div class="switch-knob"></div>

    </div>
  `;

function updateCheckItem(index, status, detail) {
  state.checks[index].status = status;
  if (detail !== undefined) state.checks[index].detail = detail;

  const iconEl = document.getElementById(`check-icon-${index}`);
  if (iconEl) {
    iconEl.className = `check-icon ${status}`;
    iconEl.innerHTML = getCheckIcon(status);
  }
  const itemEl = iconEl ? iconEl.closest('.check-item') : null;
  if (itemEl && status !== 'pending') {
    itemEl.classList.add('done');
  }
  if (itemEl && detail !== undefined) {
    let detailEl = itemEl.querySelector('.check-detail');
    if (detail) {
      if (!detailEl) {
        detailEl = document.createElement('span');
        detailEl.className = 'check-detail';
        itemEl.appendChild(detailEl);
      }
      detailEl.textContent = detail;
    } else if (detailEl) {
      detailEl.remove();
    }
  }
  updateNavButtons();
}

function runChecks() {
  state.checks.forEach((check, i) => {
    setTimeout(() => {
      // 离开步骤4后忽略旧定时器
      if (state.step !== 3) return;
      if (i === 2 && state.placeMode === 'mcfunction') {
        updateCheckItem(i, 'skip', 'mcfunction 模式无需连接');
      } else {
        updateCheckItem(i, 'success');
      }
    }, 600 * (i + 1));
  });
}

// ===================== 步骤5：放置进度 =====================
function renderStep5() {
  return `
    <div class="page-title">放置进度</div>
    <div class="page-desc" id="step5Subtitle">正在放置方块，请稍候...</div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:${state.progress}%"></div></div>
    <div class="progress-text" id="progressText">${state.progress.toFixed(1)}%</div>

    <div class="form-label" style="margin-bottom:8px">运行日志</div>
    <div class="log-box" id="logBox">
      ${state.logs.map(l => `<div class="log-line ${l.type}">[${l.time}] ${l.msg}</div>`).join('')}
    </div>

    <div id="resultArea"></div>
  `;
}

function initStep5() {
  // 防止重复启动放置
  if (_placementTimers.connection || _placementTimers.interval) return;
  state.progress = 0;
  state.logs = [];
  startPlacement();
}

function stopPlacement() {
  if (_placementTimers.connection) { clearTimeout(_placementTimers.connection); _placementTimers.connection = null; }
  if (_placementTimers.interval) { clearInterval(_placementTimers.interval); _placementTimers.interval = null; }
}

function startPlacement() {
  const parsed = state.parseResultMap && state.parseHash ? state.parseResultMap.get(state.parseHash) : null;
  const total = parsed ? parsed.block_count : 1000;
  addLog('info', `连接服务器 ${state.config.rcon_host}:${state.config.rcon_port}...`);

  _placementTimers.connection = setTimeout(() => {
    _placementTimers.connection = null;
    addLog('success', '连接成功，开始放置方块...');
    addLog('info', `共 ${total} 个方块待放置`);

    let placed = 0;
    _placementTimers.interval = setInterval(() => {
      const batch = Math.floor(Math.random() * 80) + 20;
      placed = Math.min(placed + batch, total);
      state.progress = (placed / total) * 100;

      const fill = document.getElementById('progressFill');
      const text = document.getElementById('progressText');
      if (!fill || !text) { stopPlacement(); return; }
      fill.style.width = state.progress + '%';
      text.textContent = state.progress.toFixed(1) + '%';

      if (placed % 200 < batch) {
        addLog('info', `已放置 ${placed}/${total} (${state.progress.toFixed(1)}%)`);
      }

      if (placed >= total) {
        stopPlacement();
        finishPlacement(total);
      }
    }, 150);
  }, 800);
}

function finishPlacement(total) {
  addLog('success', `所有方块放置完成！共 ${total} 个`);
  document.getElementById('step5Subtitle').innerHTML = `${icon('checkCircle')} 放置完成！`;
  document.getElementById('step5Subtitle').style.color = 'var(--success)';

  const elapsed = (Math.random() * 30 + 10).toFixed(1);
  document.getElementById('resultArea').innerHTML = `
    <div class="result-card">
      <div class="result-title">${icon("trophy")} 放置成功</div>
      <div class="result-text">
        成功放置 ${total} 个方块<br>
        耗时：${elapsed} 秒<br>
        起始坐标：(${state.config.sx}, ${state.config.sy}, ${state.config.sz})
      </div>
    </div>
  `;
  updateNavButtons();
}

function addLog(type, msg) {
  const now = new Date();
  const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  state.logs.push({ type, msg, time });
  const logBox = document.getElementById('logBox');
  if (logBox) {
    logBox.innerHTML += `<div class="log-line ${type}">[${time}] ${msg}</div>`;
    logBox.scrollTop = logBox.scrollHeight;
  }
}

// ===================== 导航 =====================
let _navigating = false;
const _placementTimers = { connection: null, interval: null };

async function nextStep() {
  if (_navigating) return;

  if (state.step === STEPS.length - 1) {
    // 完成，重置
    stopPlacement();
    state.step = 0;
    state.file = null;
    state.parseResultMap = new Map();
    state.parseHash = null;
    state.midiIsParsed = false;
    state.checks = [];
    state.progress = 0;
    state.logs = [];
    state.placeMode = state.config.place_mode || 'rcon';
    renderStepper();
    renderPage();
    return;
  }

  // 收集当前步骤的输入
  collectInputs();

  if (state.step === 0 && !state.file) {
    showToast('请先选择 MIDI 文件', 'error');
    return;
  }

  _navigating = true;
  try {
    state.step++;
    renderStepper();

    // 进入步骤2前预计算哈希并检查缓存，避免 loading 状态闪烁
    if (state.step === 1) {
      try {
        await prepareParse();
      } catch (e) {
        // 哈希计算失败，回退到步骤1
        state.step--;
        renderStepper();
        showToast('文件读取失败：' + e.message, 'error');
        return;
      }
    }

    // 进入检查步骤前先初始化检查项，避免渲染后再次重渲染
    if (state.step === 3) {
      state.checks = [
        { name: 'MIDI 文件解析', status: 'pending', detail: '' },
        { name: '方块序列生成', status: 'pending', detail: '' },
        { name: 'RCON 服务器连接', status: 'pending', detail: '' },
        { name: '放置区域可用性', status: 'pending', detail: '' }
      ];
    }

    renderPage('forward');

    if (state.step === 3) runChecks();
  } finally {
    _navigating = false;
  }
}

function prevStep() {
  if (state.step > 0) {
    collectInputs();
    // 离开步骤5时停止放置定时器
    if (state.step === 4) stopPlacement();
    state.step--;
    renderStepper();
    renderPage('backward');
  }
}

function collectInputs() {
  const getVal = (id) => document.getElementById(id)?.value;
  const num = (v, fallback) => { const n = Number(v); return Number.isFinite(n) ? n : fallback; };
  if (state.step === 0) {
    state.config.tps = num(getVal('inputTps'), 20);
    state.config.track_gap = num(getVal('inputTrackGap'), 3);
    state.config.sx = num(getVal('inputSx'), 0);
    state.config.sy = num(getVal('inputSy'), 0);
    state.config.sz = num(getVal('inputSz'), 0);
  }
  if (state.step === 2 && state.placeMode === 'rcon') {
    state.config.rcon_host = getVal('inputRconHost') || '127.0.0.1';
    state.config.rcon_port = num(getVal('inputRconPort'), 25575);
    state.config.rcon_pwd = getVal('inputRconPwd') || '';
  }
  if (state.step === 2 && state.placeMode === 'mcfunction') {
    state.config.mcfunction_output = getVal('inputMcfunctionOutput') || 'output.mcfunction';
  }
}

        <input class="form-input" value="${c.rcon_host}" id="setRconHost">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">端口</label>
          <input class="form-input" type="number" value="${c.rcon_port}" id="setRconPort">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input class="form-input" type="password" value="${c.rcon_pwd}" id="setRconPwd">
        </div>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">mcfunction 导出</div>
      <div class="form-group">
        <label class="form-label">输出文件名</label>
        <input class="form-input" value="${c.mcfunction_output}" id="setMcfunctionOutput">
      </div>
    </div>
  `;
}

function setDefaultMode(mode) {
  state.config.place_mode = mode;
  renderDrawer();
}

function setDefaultSwitch(key) {
  state.config[key] = !state.config[key];
  renderDrawer();
}

function saveDefaults() {
  const getVal = (id) => document.getElementById(id)?.value;
  const num = (v, fallback) => { const n = Number(v); return Number.isFinite(n) ? n : fallback; };
  state.config.tps = num(getVal('setTps'), 20);
  state.config.track_gap = num(getVal('setTrackGap'), 3);
  state.config.sx = num(getVal('setSx'), 0);
  state.config.sy = num(getVal('setSy'), 0);
  state.config.sz = num(getVal('setSz'), 0);
  state.config.rcon_host = getVal('setRconHost') || '127.0.0.1';
  state.config.rcon_port = num(getVal('setRconPort'), 25575);
  state.config.rcon_pwd = getVal('setRconPwd') || '';
  state.config.mcfunction_output = getVal('setMcfunctionOutput') || 'output.mcfunction';

  localStorage.setItem('mcmusic_defaults', JSON.stringify(state.config));
  closeDrawer();
  showToast('默认设置已保存', 'success');
}

function resetDefaults() {
  state.config = { ...DEFAULT_CONFIG };
  localStorage.removeItem('mcmusic_defaults');
  renderDrawer();
  showToast('已重置为默认值', 'success');
}

// ===================== 工具函数 =====================
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

/**
 * 计算包含文件的 FormData 完整哈希（SHA-256）
 */
async function hashFormData(formData, options = {}) {
  const {
    sort = false,
    includeFileName = false,
    algorithm = 'SHA-256'
  } = options;

  const items = [];

  // 遍历所有条目（包含同名多值）
  for (const [key, value] of formData.entries()) {
    if (value instanceof File || value instanceof Blob) {
      // 二进制内容：计算文件内容哈希
      const buffer = await value.arrayBuffer();
      const hashBuffer = await crypto.subtle.digest(algorithm, buffer);
      const hashHex = Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');

      // 可选：将文件名纳入哈希
      const namePart = includeFileName && value.name ? `:${value.name}` : '';
      items.push([key, `file:${hashHex}${namePart}`]);
    } else {
      // 文本字段：带类型标记避免和文件哈希混淆
      items.push([key, `text:${value}`]);
    }
  }

  // 可选排序
  if (sort) {
    items.sort((a, b) => {
      if (a[0] !== b[0]) return a[0].localeCompare(b[0]);
      return a[1].localeCompare(b[1]);
    });
  }

  // 拼接成最终字符串，计算总哈希
  const finalStr = items.map(([k, v]) => `${k}=${v}`).join('&');
  const encoder = new TextEncoder();
  const finalBuffer = await crypto.subtle.digest(algorithm, encoder.encode(finalStr));

  return Array.from(new Uint8Array(finalBuffer))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}


let _toastTimer = null;

function showToast(msg, type = '') {
  const toast = document.getElementById('toast');
  if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }

  const isError = type === 'error';
  const isSuccess = type === 'success';
  const toastIcon = isError ? icon('alertCircle') : isSuccess ? icon('checkCircle') : '';

  toast.innerHTML = `
    ${toastIcon ? `<span class="toast-icon">${toastIcon}</span>` : ''}
    <span class="toast-msg">${msg}</span>
    ${isError ? `<button class="toast-close" onclick="hideToast()">${icon('x')}</button>` : ''}
  `;
  toast.className = 'toast ' + type;

  // 点击 toast 本身也可关闭（错误类型）
  toast.style.pointerEvents = isError ? 'auto' : 'none';

  requestAnimationFrame(() => toast.classList.add('show'));

  // 错误类型不自动消失，其他类型 2.5 秒后消失
  if (!isError) {
    _toastTimer = setTimeout(() => hideToast(), 2500);
  }
}

function hideToast() {
  const toast = document.getElementById('toast');
  if (_toastTimer) { clearTimeout(_toastTimer); _toastTimer = null; }
  toast.classList.remove('show');
}
